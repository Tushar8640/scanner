plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdfpages'
version = '1.0.0'

android {
  namespace "expo.modules.pdfpages"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Opening password-protected PDFs and adding a password on export (Apache-2.0)
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
